<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 · SVG 动画</title>
  <style>
    :root {
      --ink: #17324d;
      --muted: #55728d;
      --card: rgba(255, 255, 255, 0.78);
      --accent: #ef7d4d;
      --accent-dark: #d85d32;
      --sea: #9dd9d0;
      --road: #ead9c5;
      --road-line: #caa887;
      --animation-speed: 1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.9), transparent 27%),
        linear-gradient(145deg, #f9dfb3 0%, #f6b79d 45%, #8bc7ce 100%);
    }

    .shell { width: min(1120px, 100%); }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 8px 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-dark);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 3.5rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.65;
      text-align: right;
    }

    .scene-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 28px 80px rgba(59, 72, 93, 0.22), 0 4px 14px rgba(59, 72, 93, 0.08);
      backdrop-filter: blur(10px);
    }

    .scene-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      min-height: 410px;
    }

    svg { display: block; width: 100%; height: 100%; }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
      padding: 16px 20px 18px;
      border-top: 1px solid rgba(23, 50, 77, 0.09);
      background: rgba(255, 255, 255, 0.42);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      color: white;
      background: var(--ink);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    button:hover { transform: translateY(-1px); background: #254d6f; box-shadow: 0 6px 14px rgba(23, 50, 77, 0.2); }
    button:active { transform: translateY(0); }

    .speed { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem; font-weight: 700; }
    input[type="range"] { width: 150px; accent-color: var(--accent); cursor: pointer; }
    .hint { margin-left: auto; color: var(--muted); font-size: 0.84rem; }

    .motion { transform-box: fill-box; transform-origin: center; }
    .world-drift { animation: worldDrift calc(18s / var(--animation-speed)) linear infinite; }
    .cloud-drift { animation: cloudDrift calc(30s / var(--animation-speed)) linear infinite; }
    .bird-bob { animation: birdBob calc(1.1s / var(--animation-speed)) ease-in-out infinite; }
    .wing-flap { transform-origin: 50% 72%; animation: wingFlap calc(0.72s / var(--animation-speed)) ease-in-out infinite; }
    .neck-bob { transform-origin: 50% 90%; animation: neckBob calc(0.86s / var(--animation-speed)) ease-in-out infinite; }
    .pedal-spin { transform-origin: 50% 50%; animation: pedalSpin calc(1.2s / var(--animation-speed)) linear infinite; }
    .wheel-spin { transform-origin: 50% 50%; animation: wheelSpin calc(1.2s / var(--animation-speed)) linear infinite; }
    .leg-pedal { transform-origin: 50% 10%; animation: legPedal calc(1.2s / var(--animation-speed)) ease-in-out infinite; }
    .leg-pedal-reverse { transform-origin: 50% 10%; animation: legPedalReverse calc(1.2s / var(--animation-speed)) ease-in-out infinite; }
    .water-shimmer { animation: waterShimmer calc(2.6s / var(--animation-speed)) ease-in-out infinite; }
    .feather-twitch { transform-origin: 0 100%; animation: featherTwitch calc(1.6s / var(--animation-speed)) ease-in-out infinite; }

    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

    @keyframes worldDrift { from { transform: translateX(0); } to { transform: translateX(-180px); } }
    @keyframes cloudDrift { from { transform: translateX(-30px); } to { transform: translateX(180px); } }
    @keyframes birdBob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
    @keyframes wingFlap { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-9deg) translateY(-3px); } }
    @keyframes neckBob { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg) translateY(1px); } }
    @keyframes pedalSpin { to { transform: rotate(360deg); } }
    @keyframes wheelSpin { to { transform: rotate(360deg); } }
    @keyframes legPedal { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(-24deg); } }
    @keyframes legPedalReverse { 0%, 100% { transform: rotate(-24deg); } 50% { transform: rotate(22deg); } }
    @keyframes waterShimmer { 0%, 100% { opacity: 0.24; transform: scaleX(0.92); } 50% { opacity: 0.72; transform: scaleX(1.08); } }
    @keyframes featherTwitch { 0%, 80%, 100% { transform: rotate(0deg); } 86% { transform: rotate(7deg); } 92% { transform: rotate(-3deg); } }

    @media (max-width: 700px) {
      body { padding: 14px; }
      .intro { display: block; margin-inline: 3px; }
      .subtitle { margin-top: 12px; text-align: left; }
      .scene-card { border-radius: 22px; }
      .scene-wrap { min-height: 290px; }
      .hint { width: 100%; margin-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro">
      <div>
        <p class="eyebrow">A tiny SVG story</p>
        <h1>鹈鹕，出发！</h1>
      </div>
      <p class="subtitle">一只心情很好的鹈鹕，骑着自行车沿着湖边慢慢兜风。</p>
    </header>

    <section class="scene-card" aria-label="鹈鹕骑自行车的 SVG 动画场景">
      <div class="scene-wrap" id="scene">
        <svg viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
          <title id="title">鹈鹕骑自行车</title>
          <desc id="desc">夕阳湖边，一只鹈鹕骑着自行车向右前进，车轮转动、翅膀扇动、湖面闪烁。</desc>

          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc8d6" /><stop offset="0.62" stop-color="#f6c9a3" /><stop offset="1" stop-color="#f3a878" /></linearGradient>
            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72b8be" /><stop offset="1" stop-color="#3d7e98" /></linearGradient>
            <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4e5d2" /><stop offset="1" stop-color="#d9bb9d" /></linearGradient>
            <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf3" /><stop offset="1" stop-color="#e6e2d7" /></linearGradient>
            <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6a54e" /><stop offset="1" stop-color="#d86b39" /></linearGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="10" /></filter>
            <clipPath id="waterClip"><rect x="0" y="390" width="1200" height="220" /></clipPath>
          </defs>

          <rect width="1200" height="675" fill="url(#sky)" />
          <circle cx="988" cy="142" r="64" fill="#ffe6a4" opacity="0.9" />
          <circle cx="988" cy="142" r="104" fill="#ffe6a4" opacity="0.18" />

          <!-- drifting clouds -->
          <g class="cloud-drift" fill="#fff6e7" opacity="0.62">
            <g transform="translate(80 112)"><ellipse cx="70" cy="42" rx="70" ry="23" /><ellipse cx="35" cy="37" rx="31" ry="29" /><ellipse cx="90" cy="25" rx="39" ry="37" /><ellipse cx="132" cy="41" rx="32" ry="24" /></g>
            <g transform="translate(650 70) scale(.72)"><ellipse cx="70" cy="42" rx="70" ry="23" /><ellipse cx="35" cy="37" rx="31" ry="29" /><ellipse cx="90" cy="25" rx="39" ry="37" /><ellipse cx="132" cy="41" rx="32" ry="24" /></g>
          </g>

          <!-- distant hills and lake -->
          <path d="M0 366 Q130 293 244 354 T470 340 T707 351 T932 326 T1200 348 V425 H0Z" fill="#8fb09e" opacity="0.76" />
          <path d="M0 390 Q180 361 351 395 T703 383 T1053 396 T1200 382 V610 H0Z" fill="url(#water)" />
          <g class="world-drift" clip-path="url(#waterClip)" fill="none" stroke="#a8e0d3" stroke-linecap="round">
            <path d="M-40 430 C120 413 180 446 330 428 S610 412 760 433 S1020 448 1260 424" stroke-width="5" opacity="0.32" />
            <path d="M-100 471 C84 451 205 484 373 463 S673 456 832 480 S1068 484 1300 462" stroke-width="3" opacity="0.28" />
            <path d="M-80 523 C80 507 224 537 393 516 S713 501 880 526 S1095 542 1270 515" stroke-width="5" opacity="0.2" />
            <path d="M-30 568 C125 549 292 584 430 561 S720 552 906 574 S1100 587 1270 562" stroke-width="3" opacity="0.25" />
          </g>
          <g class="water-shimmer" fill="none" stroke="#ffe6b1" stroke-linecap="round"><path d="M862 439 h78" stroke-width="5" opacity="0.8" /><path d="M891 456 h115" stroke-width="3" opacity="0.62" /><path d="M918 475 h62" stroke-width="4" opacity="0.5" /></g>

          <!-- foreground bank and moving road texture -->
          <path d="M0 538 Q220 502 421 526 Q633 551 814 523 Q1007 494 1200 523 V675 H0Z" fill="#7f9e73" />
          <path d="M0 570 Q220 521 449 559 Q654 594 844 553 Q1033 513 1200 548 V675 H0Z" fill="url(#road)" />
          <g class="world-drift" fill="none" stroke="#fff2dc" stroke-linecap="round" opacity="0.9"><path d="M70 610 h95" stroke-width="8" /><path d="M315 625 h125" stroke-width="8" /><path d="M608 602 h110" stroke-width="8" /><path d="M900 624 h135" stroke-width="8" /><path d="M1144 596 h110" stroke-width="8" /></g>

          <!-- grass details -->
          <g fill="none" stroke="#577957" stroke-linecap="round" stroke-width="4" opacity="0.72"><path d="M74 576 l-10 -26 M78 576 l15 -31 M108 570 l-2 -27 M111 570 l17 -23" /><path d="M1088 563 l-11 -27 M1092 563 l17 -32 M1132 560 l-4 -22 M1135 560 l18 -27" /></g>

          <ellipse cx="618" cy="587" rx="253" ry="28" fill="#284c5c" opacity="0.22" filter="url(#softShadow)" />

          <!-- bike + pelican -->
          <g class="bird-bob" transform="translate(0 -3)">
            <!-- bicycle -->
            <g stroke="#17324d" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <g class="wheel-spin" transform="translate(484 542)"><circle r="72" stroke="#f5f5e8" stroke-width="9" /><circle r="63" stroke="#17324d" stroke-width="3" opacity="0.78" /><path d="M0 -63 V63 M-63 0 H63 M-45 -45 L45 45 M45 -45 L-45 45" stroke="#17324d" stroke-width="2" opacity="0.42" /></g>
              <g class="wheel-spin" transform="translate(735 542)"><circle r="72" stroke="#f5f5e8" stroke-width="9" /><circle r="63" stroke="#17324d" stroke-width="3" opacity="0.78" /><path d="M0 -63 V63 M-63 0 H63 M-45 -45 L45 45 M45 -45 L-45 45" stroke="#17324d" stroke-width="2" opacity="0.42" /></g>
              <path d="M484 542 L563 458 L735 542 L647 542 L563 458 L607 542 Z" stroke-width="10" />
              <path d="M563 458 L544 414" stroke-width="9" /><path d="M524 414 H568" stroke-width="9" /><path d="M735 542 L758 441" stroke-width="8" /><path d="M734 442 L776 432" stroke-width="8" />
              <path d="M603 542 L630 519 M603 542 L576 565" stroke-width="5" /><circle cx="603" cy="542" r="13" fill="#ef7d4d" stroke-width="4" />
            </g>
            <path d="M486 543 Q606 573 734 543" stroke="#274d64" stroke-width="6" fill="none" opacity="0.35" />

            <!-- far leg -->
            <g class="leg-pedal-reverse" fill="none" stroke="#e7e2d6" stroke-linecap="round" stroke-linejoin="round"><path d="M610 412 C638 454 636 481 605 526" stroke-width="20" /><path d="M605 526 l-17 24" stroke="#ef7d4d" stroke-width="10" /><path d="M584 548 l-21 -1" stroke="#17324d" stroke-width="8" /></g>
            <!-- near leg -->
            <g class="leg-pedal" fill="none" stroke="#fffdf3" stroke-linecap="round" stroke-linejoin="round"><path d="M617 411 C588 457 581 485 620 526" stroke-width="21" /><path d="M620 526 l17 24" stroke="#f1a557" stroke-width="10" /><path d="M639 549 l20 1" stroke="#17324d" stroke-width="8" /></g>

            <!-- pelican body -->
            <g><ellipse cx="607" cy="362" rx="88" ry="101" fill="url(#feather)" stroke="#17324d" stroke-width="5" /><ellipse cx="579" cy="383" rx="51" ry="68" fill="#dcded7" opacity="0.8" /><path d="M548 339 C567 307 619 300 659 336 C643 347 634 369 637 395 C603 384 570 370 548 339Z" fill="#c7cec8" stroke="#17324d" stroke-width="4" /><path d="M591 317 C614 292 654 301 671 327 C648 327 629 338 622 357 C609 348 598 335 591 317Z" fill="#f8f5e8" stroke="#17324d" stroke-width="4" /><path d="M617 307 Q665 326 677 370" fill="none" stroke="#fffdf3" stroke-width="9" stroke-linecap="round" /><path d="M574 412 Q609 437 643 411" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" opacity="0.65" /></g>

            <!-- near wing -->
            <g class="wing-flap"><path d="M570 346 C523 344 477 371 464 420 C493 413 531 422 562 449 C583 417 588 380 570 346Z" fill="#fffdf3" stroke="#17324d" stroke-width="5" /><path d="M536 374 C512 386 494 404 479 420 M550 386 C529 402 514 419 501 437 M559 401 C544 420 534 433 528 446" fill="none" stroke="#bdc7c2" stroke-width="4" stroke-linecap="round" /></g>

            <!-- neck and head -->
            <g class="neck-bob"><path d="M640 323 C655 273 680 245 723 246 C746 247 760 264 757 286 C752 315 716 340 665 349Z" fill="url(#feather)" stroke="#17324d" stroke-width="5" /><path d="M713 250 C738 231 775 236 793 258 C807 277 793 302 767 309 C746 314 725 299 713 280Z" fill="#f8f5e8" stroke="#17324d" stroke-width="5" /><path d="M753 279 C782 270 829 280 884 303 C893 307 895 319 885 324 C841 337 793 331 758 310Z" fill="url(#beak)" stroke="#17324d" stroke-width="5" /><path d="M761 303 C795 310 839 316 883 311" fill="none" stroke="#9c4d35" stroke-width="4" opacity="0.85" /><circle cx="771" cy="268" r="9" fill="#17324d" /><circle cx="774" cy="264" r="3" fill="#fffdf3" /><path d="M745 247 Q758 224 781 241" fill="none" stroke="#d85d32" stroke-width="8" stroke-linecap="round" /><path d="M723 255 Q709 229 732 218" fill="none" stroke="#d85d32" stroke-width="7" stroke-linecap="round" class="feather-twitch" /><path d="M739 249 Q730 218 754 211" fill="none" stroke="#d85d32" stroke-width="7" stroke-linecap="round" /></g>

            <!-- handlebars and wing grip -->
            <path d="M616 338 C602 353 586 376 562 414" fill="none" stroke="#17324d" stroke-width="7" stroke-linecap="round" />
            <path d="M653 342 C680 360 703 382 733 438" fill="none" stroke="#fffdf3" stroke-width="19" stroke-linecap="round" /><path d="M653 342 C680 360 703 382 733 438" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" opacity="0.72" /><circle cx="733" cy="438" r="9" fill="#ef7d4d" stroke="#17324d" stroke-width="4" />
          </g>

          <!-- foreground flowers -->
          <g transform="translate(256 556)"><path d="M0 48 Q7 13 2 0 M2 31 Q-13 16 -22 17 M4 27 Q19 10 29 12" fill="none" stroke="#406d56" stroke-width="5" stroke-linecap="round" /><circle cx="2" cy="1" r="9" fill="#f5db66" /><circle cx="-7" cy="0" r="7" fill="#ee8971" /><circle cx="11" cy="0" r="7" fill="#ee8971" /></g>
          <g transform="translate(1018 545) scale(.82)"><path d="M0 48 Q7 13 2 0 M2 31 Q-13 16 -22 17 M4 27 Q19 10 29 12" fill="none" stroke="#406d56" stroke-width="5" stroke-linecap="round" /><circle cx="2" cy="1" r="9" fill="#f5db66" /><circle cx="-7" cy="0" r="7" fill="#ee8971" /><circle cx="11" cy="0" r="7" fill="#ee8971" /></g>
        </svg>
      </div>

      <div class="controls">
        <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
        <label class="speed" for="speed">速度 <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" /> <output id="speedValue">1.0×</output></label>
        <span class="hint">提示：点击画面也可以暂停 / 播放</span>
      </div>
    </section>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    const speed = document.getElementById('speed');
    const speedValue = document.getElementById('speedValue');

    function setPaused(paused) {
      scene.classList.toggle('paused', paused);
      toggle.textContent = paused ? '播放动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    }

    function togglePaused() { setPaused(!scene.classList.contains('paused')); }
    toggle.addEventListener('click', togglePaused);
    scene.addEventListener('click', (event) => {
      if (event.target.closest('button, input, label')) return;
      togglePaused();
    });

    speed.addEventListener('input', () => {
      document.documentElement.style.setProperty('--animation-speed', speed.value);
      speedValue.value = Number(speed.value).toFixed(1) + '×';
      speedValue.textContent = speedValue.value;
    });
  </script>
</body>
</html>
